name = "velvet"
version = "0.1.0"
defaultTargets = ["velvet"]

[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "v4.35.0"

[[lean_lib]]
name = "Velvet"

[[lean_lib]]
name = "Examples"
roots = ["Velvet.Examples"]
globs = ["Velvet.Examples.*"]
leanOptions = { sym.debug = true }

[[lean_exe]]
name = "velvet"
root = "Main"

[[require]]
name = "Colean"
git = "https://github.com/verse-lab/colean"
rev = "77ad65dac0186b6b6a5a7dce3afa667dbfc1cf0c"
